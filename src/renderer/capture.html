<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Island — выделение</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: crosshair; user-select: none; font-family: "Segoe UI", system-ui, sans-serif; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #hint { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.8); color: #fff; padding: 8px 16px; border-radius: 18px; font-size: 13px; pointer-events: none; }
    #loupe { position: fixed; width: 120px; height: 120px; border-radius: 50%; border: 3px solid #fff; overflow: hidden; pointer-events: none; display: none; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
    #loupe canvas { image-rendering: pixelated; }
    #hex { position: fixed; pointer-events: none; display: none; background: #000; color: #fff; padding: 3px 8px; border-radius: 8px; font: 12px monospace; }
    #size { position: fixed; pointer-events: none; display: none; background: rgba(0,0,0,.8); color: #fff; padding: 2px 6px; border-radius: 6px; font-size: 11px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hint"></div>
  <div id="loupe"><canvas id="lc" width="120" height="120"></canvas></div>
  <div id="hex"></div>
  <div id="size"></div>
  <script src="../../node_modules/jsqr/dist/jsQR.js"></script>
  <script src="capture.js"></script>
</body>
</html>
